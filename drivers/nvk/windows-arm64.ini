# Meson cross file: Windows ARM64 with LLVM-MinGW (UCRT) and Rust's gnullvm target, as
# mesa-switch-woa's PORTING.md describes. Used inside the switch-wp-nvk container.
[binaries]
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
windres = 'aarch64-w64-mingw32-windres'
rust = ['rustc', '--target', 'aarch64-pc-windows-gnullvm', '-C', 'linker=aarch64-w64-mingw32-clang']
bindgen = 'bindgen'
# Keep the build host's libraries out.
pkg-config = 'false'
cmake = 'false'

[properties]
needs_exe_wrapper = true
bindgen_clang_arguments = ['--target=aarch64-w64-mingw32', '--sysroot=/opt/llvm-mingw/aarch64-w64-mingw32',
                           '-isystem', '/opt/llvm-mingw/aarch64-w64-mingw32/include',
                           '-isystem', '/nvk/bindgen-include']

[built-in options]
cpp_link_args = ['-static-libstdc++', '-static-libgcc']

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
